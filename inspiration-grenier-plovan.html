<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuancier – escalier et chambres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9E8E4; --surface:#F5F5F3; --ink:#1F2328; --muted:#62676C; --line:#D2D0CA; --focus:#1F2328;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#16181A; --surface:#202326; --ink:#ECEBE7; --muted:#9BA0A4; --line:#33373B; --focus:#ECEBE7;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#16181A; --surface:#202326; --ink:#ECEBE7; --muted:#9BA0A4; --line:#33373B; --focus:#ECEBE7;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45}
.app{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:clamp(16px,3vw,40px);
  max-width:1280px;margin:0 auto;padding:clamp(12px,2.5vw,32px)}
.stage{position:sticky;top:clamp(12px,2.5vw,32px);align-self:start}
.photo{position:relative;border-radius:6px;overflow:hidden;background:var(--line);
  width:min(100%, calc((100vh - 72px) * 1014 / 1282));aspect-ratio:1014/1282;margin:0 auto}
.photo canvas{display:block;width:100%;height:100%;cursor:crosshair}
.photo #flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .9s ease-out}
.compare{position:absolute;left:12px;bottom:12px;border:0;border-radius:999px;padding:9px 16px;
  font:inherit;font-size:14px;font-weight:500;background:rgba(20,22,24,.78);color:#fff;cursor:pointer;
  -webkit-user-select:none;user-select:none;touch-action:none;backdrop-filter:blur(6px)}
.compare[aria-pressed="true"]{background:#fff;color:#1F2328}
.hint{font-size:13px;color:var(--muted);margin:10px 2px 0;text-align:center}
h1{font-size:clamp(26px,3.2vw,38px);line-height:1.05;font-weight:700;letter-spacing:-.02em;margin:4px 0 6px}
.lede{color:var(--muted);margin:0 0 22px;max-width:46ch}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.zone{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;
  transition:border-color .15s, box-shadow .15s}
.zone .chip{height:74px;position:relative}
.zone .chip.orig{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.18) 6px 7px)}
.zone .meta{padding:9px 11px 11px}
.zone .zn{font-weight:700;font-size:15px;line-height:1.2}
.zone .cn{font-size:13px;color:var(--muted);margin-top:2px;display:flex;justify-content:space-between;gap:6px}
.zone .cn code{font-family:inherit;font-variant-numeric:tabular-nums;opacity:.85}
.zone[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.zone:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.zone.disabled{opacity:.55}
.link{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:12px 2px 26px}
.link input{width:18px;height:18px;accent-color:var(--ink)}
h2{font-size:18px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.target{color:var(--muted);font-size:14px;margin:0 0 14px}
.target b{color:var(--ink);font-weight:500}
.fam{margin-bottom:14px}
.fam h3{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 6px}
.sw{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;max-width:440px}
.s{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1/1.15;border-radius:3px;position:relative;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.s span{position:absolute;left:0;right:0;bottom:0;padding:3px 4px;font-size:10.5px;line-height:1.15;
  background:rgba(255,255,255,.82);color:#1F2328;opacity:0;transition:opacity .12s}
.s:hover span,.s:focus-visible span,.s[aria-pressed="true"] span{opacity:1}
.s:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.s[aria-pressed="true"]{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.custom{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:18px 0 8px}
.custom label{font-size:14px;color:var(--muted)}
.custom input[type=color]{width:46px;height:38px;padding:0;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer}
.custom input[type=text]{width:100px;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink)}
.btn{font:inherit;font-size:14px;font-weight:500;padding:8px 14px;border-radius:4px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:focus-visible,.custom input:focus-visible,.link input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px}
section.saved{border-top:1px solid var(--line);margin-top:26px;padding-top:20px}
.saveform{display:flex;gap:8px;margin:10px 0 14px}
.saveform input{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.amb{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 8px 8px 10px}
.amb .strip{display:flex;width:84px;height:28px;border-radius:2px;overflow:hidden;flex:none}
.amb .strip i{flex:1}
.amb .apply{all:unset;cursor:pointer;flex:1;font-size:15px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amb .apply:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.amb .del{all:unset;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:2px 8px;border-radius:3px}
.amb .del:hover{color:var(--ink)}
.empty{font-size:14px;color:var(--muted);margin:0}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:8px 0 6px;margin:-8px 0 0}
  .photo{width:min(100%, calc(52vh * 1014 / 1282))}
  .hint{display:none}
  .zone .chip{height:52px}
  .compare{font-size:13px;padding:7px 12px;left:8px;bottom:8px}
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
@media (prefers-reduced-motion:reduce){.photo #flash,.zone,.s span{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <div class="photo" id="photo">
      <canvas id="cv" width="1014" height="1282" aria-label="Photo du palier avec les couleurs choisies"></canvas>
      <canvas id="flash" width="1014" height="1282" aria-hidden="true"></canvas>
      <button class="compare" id="compare" type="button" aria-pressed="false">Maintenir pour voir l’original</button>
    </div>
    <p class="hint">Touchez un mur sur la photo pour le sélectionner.</p>
  </div>

  <main>
    <h1>Nuancier du palier</h1>
    <p class="lede">Choisissez un mur, puis une teinte. L’ombre et la lumière de la photo sont conservées, pour juger la couleur telle qu’elle rendra chez vous.</p>

    <div class="zones" id="zones" role="group" aria-label="Murs à peindre"></div>
    <label class="link"><input type="checkbox" id="linked" checked> Contremarches de la même couleur que la cage d’escalier</label>

    <h2>Teintes</h2>
    <p class="target" id="target"></p>
    <div id="palette"></div>

    <div class="custom">
      <label for="picker">Teinte sur mesure</label>
      <input type="color" id="picker" value="#a3b09a">
      <input type="text" id="hex" value="#A3B09A" maxlength="7" aria-label="Code hexadécimal" spellcheck="false">
      <button class="btn" type="button" id="applyHex">Appliquer</button>
    </div>
    <div class="row">
      <button class="btn primary" type="button" id="download" hidden>Télécharger l’image</button>
      <button class="btn" type="button" id="resetZone">Remettre la couleur d’origine</button>
      <button class="btn" type="button" id="resetAll">Tout remettre d’origine</button>
    </div>

  </main>
</div>

<script>
(function(){
const W=1014,H=1282,N=W*H;
const PALETTE=[
 {f:'Blancs et neutres',c:[['Blanc craie','#F2EFE8'],['Lin','#E6DFD3'],['Grège','#CFC4B4'],['Gris perle','#C9CBC8'],['Galet','#A39E94']]},
 {f:'Verts',c:[['Vert amande','#C5CFB0'],['Sauge','#A3B09A'],['Vert de gris','#6E8B7E'],['Olive','#7C7B4E'],['Forêt','#2F4A3D']]},
 {f:'Bleus',c:[['Bleu brume','#B9C6CF'],['Bleu ciel','#9DB8CF'],['Bleu orage','#5E7383'],['Canard','#2E5A61'],['Bleu nuit','#23324A']]},
 {f:'Terres et ocres',c:[['Sable','#D9C3A0'],['Ocre jaune','#D9A441'],['Terracotta','#B8643F'],['Argile','#A07760'],['Brun tabac','#6B4A35']]},
 {f:'Roses et rouges',c:[['Rose poudré','#E2C2B9'],['Vieux rose','#C08D8B'],['Corail','#DA7F68'],['Rouge brique','#9C3E32'],['Bordeaux','#5E2531']]},
 {f:'Sombres',c:[['Anthracite','#3A3D40'],['Encre','#22282F'],['Aubergine','#3F2E3A'],['Kaki sombre','#4A4A36']]}
];
const NAMES={};PALETTE.forEach(g=>g.c.forEach(([n,h])=>NAMES[h.toUpperCase()]=n));
const ZONES=[
 {id:'stairs',name:'Cage d’escalier',orig:'#574E31',ref:0.0767},
 {id:'risers',name:'Contremarches',orig:'#574E31',ref:0.0767},
 {id:'left',name:'Chambre de gauche',orig:'#B77B2D',ref:0.2440},
 {id:'right',name:'Chambre de droite',orig:'#777049',ref:0.1614}
];
const RISERS=[[384,338],[530,338],[606,1122],[326,1122]];
const KEY='nuancier-palier-v1';

let state={colors:{stairs:null,risers:null,left:null,right:null},linked:true,active:'stairs'};
let saved=[];
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){if(s.state)state=Object.assign(state,s.state);if(Array.isArray(s.saved))saved=s.saved;}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({state,saved}))}catch(e){}}

const toLin=new Float32Array(256);for(let i=0;i<256;i++){const c=i/255;toLin[i]=c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
const LUTN=4096,toS=new Uint8ClampedArray(LUTN+1);for(let i=0;i<=LUTN;i++){const c=i/LUTN;toS[i]=Math.round(255*(c<=0.0031308?c*12.92:1.055*Math.pow(c,1/2.4)-0.055));}
const hexLin=h=>{h=h.replace('#','');return[0,2,4].map(i=>toLin[parseInt(h.substr(i,2),16)]);};
const shoulder=x=>x<0.8?x:0.8+0.2*(1-Math.exp(-(x-0.8)/0.2));

const cv=document.getElementById('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
const flash=document.getElementById('flash'),fctx=flash.getContext('2d');
let src,lin,Y,weights={},idx={},outImg,ready=false;

function loadImg(el){return new Promise((res,rej)=>{if(el.complete&&el.naturalWidth)res(el);else{el.onload=()=>res(el);el.onerror=rej;}});}
Promise.all([loadImg(document.getElementById('srcImg')),loadImg(document.getElementById('maskImg'))]).then(([im,mk])=>{
  const o=document.createElement('canvas');o.width=W;o.height=H;const oc=o.getContext('2d',{willReadFrequently:true});
  oc.drawImage(im,0,0,W,H);src=oc.getImageData(0,0,W,H);
  oc.clearRect(0,0,W,H);oc.drawImage(mk,0,0,W,H);const m=oc.getImageData(0,0,W,H).data;
  oc.clearRect(0,0,W,H);oc.fillStyle='#fff';oc.beginPath();RISERS.forEach(([x,y],i)=>i?oc.lineTo(x,y):oc.moveTo(x,y));oc.closePath();oc.fill();
  const t=oc.getImageData(0,0,W,H).data;
  lin=new Float32Array(N*3);Y=new Float32Array(N);
  for(const z of ZONES)weights[z.id]=new Float32Array(N);
  const lists={stairs:[],risers:[],left:[],right:[]};
  const d=src.data;
  for(let p=0;p<N;p++){
    const r=toLin[d[p*4]],g=toLin[d[p*4+1]],b=toLin[d[p*4+2]];
    lin[p*3]=r;lin[p*3+1]=g;lin[p*3+2]=b;Y[p]=0.2126*r+0.7152*g+0.0722*b;
    const L=m[p*4]/255,R=m[p*4+1]/255,S=m[p*4+2]/255,tr=t[p*4]>127;
    if(L>0){weights.left[p]=L;lists.left.push(p);}
    if(R>0){weights.right[p]=R;lists.right.push(p);}
    if(S>0){if(tr){weights.risers[p]=S;lists.risers.push(p);}else{weights.stairs[p]=S;lists.stairs.push(p);}}
  }
  for(const k in lists)idx[k]=Int32Array.from(lists[k]);
  outImg=ctx.createImageData(W,H);
  ready=true;render();
}).catch(()=>{document.getElementById('photo').insertAdjacentHTML('beforeend','<p style="position:absolute;inset:auto 0 50%;text-align:center">La photo n’a pas pu être chargée. Rechargez la page.</p>');});

function effective(id){return id==='risers'&&state.linked?state.colors.stairs:state.colors[id];}

let showOriginal=false;
function render(){
  if(!ready)return;
  const o=outImg.data,d=src.data;
  o.set(d);
  if(!showOriginal){
    for(const z of ZONES){
      const hex=effective(z.id);if(!hex)continue;
      const [tr,tg,tb]=hexLin(hex),w=weights[z.id],ix=idx[z.id],inv=1/z.ref;
      for(let i=0;i<ix.length;i++){
        const p=ix[i],a=w[p],k=Y[p]*inv,q=p*3,j=p*4;
        const nr=shoulder(tr*k),ng=shoulder(tg*k),nb=shoulder(tb*k);
        const r=lin[q]+(nr-lin[q])*a,g=lin[q+1]+(ng-lin[q+1])*a,b=lin[q+2]+(nb-lin[q+2])*a;
        o[j]=toS[Math.min(LUTN,Math.max(0,(r*LUTN)|0))];
        o[j+1]=toS[Math.min(LUTN,Math.max(0,(g*LUTN)|0))];
        o[j+2]=toS[Math.min(LUTN,Math.max(0,(b*LUTN)|0))];
      }
    }
  }
  ctx.putImageData(outImg,0,0);
}

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function flashZone(id){
  if(!ready)return;
  const ids=(id==='stairs'&&state.linked)?['stairs','risers']:(id==='risers'&&state.linked?['stairs','risers']:[id]);
  const img=fctx.createImageData(W,H),f=img.data;
  for(const zid of ids){const ix=idx[zid],w=weights[zid];for(let i=0;i<ix.length;i++){const p=ix[i];f[p*4]=255;f[p*4+1]=255;f[p*4+2]=255;f[p*4+3]=Math.round(w[p]*255);}}
  fctx.putImageData(img,0,0);
  flash.style.transition='none';flash.style.opacity=reduce?'0':'0.6';
  void flash.offsetWidth;flash.style.transition='';requestAnimationFrame(()=>{flash.style.opacity='0';});
}

const $=id=>document.getElementById(id);
function colorLabel(hex){return hex?(NAMES[hex.toUpperCase()]||'Sur mesure'):'Couleur d’origine';}
function renderZones(){
  const box=$('zones');box.innerHTML='';
  for(const z of ZONES){
    const hex=effective(z.id),b=document.createElement('button');
    b.type='button';b.className='zone'+(z.id==='risers'&&state.linked?' disabled':'');
    b.setAttribute('aria-pressed',String(state.active===z.id));
    const shown=hex||z.orig;
    b.innerHTML='<div class="chip'+(hex?'':' orig')+'" style="background-color:'+shown+'"></div><div class="meta"><div class="zn"></div><div class="cn"><span></span><code></code></div></div>';
    b.querySelector('.zn').textContent=z.name;
    b.querySelector('.cn span').textContent=z.id==='risers'&&state.linked?'Comme la cage':colorLabel(hex);
    b.querySelector('code').textContent=hex?hex.toUpperCase():'';
    b.addEventListener('click',()=>selectZone(z.id));
    box.appendChild(b);
  }
  $('linked').checked=state.linked;
  const az=ZONES.find(z=>z.id===state.active);
  $('target').innerHTML='Pour : <b></b>';$('target').querySelector('b').textContent=az.name;
  const cur=(effective(state.active)||'').toUpperCase();
  document.querySelectorAll('.s').forEach(s=>s.setAttribute('aria-pressed',String(s.dataset.hex===cur)));
  const pv=effective(state.active)||az.orig;$('picker').value=pv.toLowerCase();$('hex').value=pv.toUpperCase();
}
function selectZone(id){
  if(id==='risers'&&state.linked){state.linked=false;state.colors.risers=state.colors.stairs;}
  state.active=id;persist();renderZones();flashZone(id);
}
function setColor(hex){
  const id=state.active;state.colors[id]=hex?hex.toUpperCase():null;persist();render();renderZones();
}
function buildPalette(){
  const p=$('palette');
  for(const g of PALETTE){
    const fam=document.createElement('div');fam.className='fam';
    fam.innerHTML='<h3></h3><div class="sw"></div>';fam.querySelector('h3').textContent=g.f;
    const sw=fam.querySelector('.sw');
    for(const [n,h] of g.c){
      const b=document.createElement('button');b.type='button';b.className='s';b.style.background=h;b.dataset.hex=h.toUpperCase();
      b.setAttribute('aria-label',n+' '+h);b.title=n;b.innerHTML='<span></span>';b.querySelector('span').textContent=n;
      b.addEventListener('click',()=>setColor(h));sw.appendChild(b);
    }
    p.appendChild(fam);
  }
}

$('linked').addEventListener('change',e=>{
  state.linked=e.target.checked;
  if(state.linked&&state.active==='risers')state.active='stairs';
  persist();render();renderZones();
});
$('picker').addEventListener('input',e=>{$('hex').value=e.target.value.toUpperCase();setColor(e.target.value);});
function applyHex(){let v=$('hex').value.trim();if(!v.startsWith('#'))v='#'+v;if(/^#[0-9a-fA-F]{6}$/.test(v))setColor(v);else{$('hex').setCustomValidity('Format attendu : #RRGGBB');$('hex').reportValidity();}}
$('hex').addEventListener('input',()=>$('hex').setCustomValidity(''));
$('hex').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();applyHex();}});
$('applyHex').addEventListener('click',applyHex);
$('resetZone').addEventListener('click',()=>setColor(null));
$('resetAll').addEventListener('click',()=>{state.colors={stairs:null,risers:null,left:null,right:null};state.linked=true;if(state.active==='risers')state.active='stairs';persist();render();renderZones();});

const cmp=$('compare');
const on=e=>{e.preventDefault();showOriginal=true;cmp.setAttribute('aria-pressed','true');render();};
const off=()=>{if(!showOriginal)return;showOriginal=false;cmp.setAttribute('aria-pressed','false');render();};
cmp.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>cmp.addEventListener(t,off));
cmp.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat)on(e);});
cmp.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')off();});
cmp.addEventListener('contextmenu',e=>e.preventDefault());

cv.addEventListener('click',e=>{
  if(!ready)return;const r=cv.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/r.width*W),y=Math.floor((e.clientY-r.top)/r.height*H);
  if(x<0||y<0||x>=W||y>=H)return;
  let best=null,bv=0.3;
  for(let dy=-4;dy<=4;dy+=2)for(let dx=-4;dx<=4;dx+=2){const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=W||yy>=H)continue;const p=yy*W+xx;
    for(const z of ZONES){const v=weights[z.id][p];if(v>bv){bv=v;best=z.id;}}}
  if(best){if(best==='risers'&&state.linked)best='stairs';selectZone(best);}
});


// Téléchargement de l'image (avec légende des couleurs)
const dlBtn=$('download');
let saveFile=null;
function makeImage(){
  return new Promise(res=>{
    const was=showOriginal;showOriginal=false;render();
    const band=128,c=document.createElement('canvas');c.width=W;c.height=H+band;const x=c.getContext('2d');
    x.drawImage(cv,0,0);
    x.fillStyle='#F5F5F3';x.fillRect(0,H,W,band);
    const font='"Bricolage Grotesque",system-ui,sans-serif';
    const items=ZONES.filter(z=>!(z.id==='risers'&&state.linked));
    const colW=(W-48)/items.length;
    items.forEach((z,i)=>{
      const hex=effective(z.id),x0=24+i*colW,y0=H+28;
      x.fillStyle=hex||z.orig;x.fillRect(x0,y0,56,72);
      x.strokeStyle='rgba(0,0,0,.12)';x.strokeRect(x0+.5,y0+.5,55,71);
      x.fillStyle='#1F2328';x.font='700 19px '+font;
      const nm=z.id==='stairs'&&state.linked?'Escalier':z.name;
      x.fillText(nm,x0+70,y0+22,colW-80);
      x.fillStyle='#62676C';x.font='400 16px '+font;
      x.fillText(colorLabel(hex),x0+70,y0+46,colW-80);
      if(hex)x.fillText(hex.toUpperCase(),x0+70,y0+68,colW-80);
    });
    showOriginal=was;render();
    c.toBlob(b=>res(b),'image/jpeg',0.92);
  });
}
function fileName(){
  const parts=ZONES.filter(z=>!(z.id==='risers'&&state.linked)).map(z=>colorLabel(effective(z.id)));
  return ('palier – '+parts.join(', ')).replace(/’/g,"'").replace(/[\\/:*?"<>|]/g,'').slice(0,120)+'.jpg';
}
const inViewer=typeof window.claude==='object'&&window.claude&&typeof window.claude.use==='function';
if(inViewer){
  window.claude.use('downloads').then(d=>{if(d){saveFile=d;dlBtn.hidden=false;}}).catch(()=>{});
}else{
  dlBtn.hidden=false;
}
dlBtn.addEventListener('click',async()=>{
  if(!ready)return;
  const label=dlBtn.textContent;dlBtn.disabled=true;dlBtn.textContent='Préparation…';
  try{
    const blob=await makeImage();
    if(saveFile){
      try{await saveFile.save({filename:fileName(),data:blob});}
      catch(e){if(e&&['unavailable','not_granted','capability_disabled','capability_removed'].includes(e.code))dlBtn.hidden=true;}
    }else{
      const url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=fileName();document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
    }
  }finally{dlBtn.disabled=false;dlBtn.textContent=label;}
});

buildPalette();renderZones();
})();
</script>
</body>
